name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp versions
        # Проставляем версию в sw.js (для инвалидации кэша) и в index.html (для отображения).
        # Формат: v25.8.7 = год.месяц.день без ведущих нулей — сразу понятно когда сделан деплой.
        # Разработчику НЕ нужно вручную менять ни CACHE_NAME, ни номер версии в HTML.
        run: |
          BUILD=$(date +%-y.%-m.%-d)
          CACHE_VER=$(date +%s)
          # Обновляем версию кэша в Service Worker
          sed -i "s/karafon-v[0-9]*/karafon-v${CACHE_VER}/g" public/sw.js
          # Обновляем видимую версию в приложении
          sed -i "s|<span id=\"app-version\">[^<]*</span>|<span id=\"app-version\">v${BUILD}</span>|" public/index.html
          echo "Deployed: v${BUILD} (cache: karafon-v${CACHE_VER})"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: KaRaFoN to GitHub Pages'
