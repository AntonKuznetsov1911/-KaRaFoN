name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp SW cache version
        # Автоматически заменяем karafon-vN на karafon-v<unix_timestamp>.
        # Это гарантирует что каждый деплой — новая версия кэша.
        # Разработчику НЕ нужно вручную менять CACHE_NAME в sw.js.
        run: |
          VERSION=$(date +%s)
          sed -i "s/karafon-v[0-9]*/karafon-v${VERSION}/g" public/sw.js
          echo "SW cache version stamped: karafon-v${VERSION}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: KaRaFoN to GitHub Pages'
